[project]
name = "career-job-scout"
version = "0.1.0"
description = "Consent-first junior-job scout for Mexico and Mexico-eligible remote roles"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6.0,<7",
  "tenacity>=8.4,<10",
  "scrapling[fetchers]>=0.4,<1",
]

[project.scripts]
job-scout = "job_scout.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.6,<1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_scout"]
